<!DOCTYPE html>
<html>
<head>
    <title>Employee Performance Evaluation Expert System</title>

    <style>

        body{
            font-family: Arial;
            background:#f2f2f2;
            text-align:center;
        }

        .container{
            width:400px;
            margin:auto;
            margin-top:50px;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0px 0px 10px gray;
        }

        input{
            width:90%;
            padding:10px;
            margin:8px;
        }

        button{
            padding:10px 20px;
            background:blue;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        #result{
            margin-top:20px;
            text-align:left;
        }

    </style>
</head>

<body>

    <div class="container">

        <h2>Employee Performance Evaluation</h2>

        <input type="text" id="name" placeholder="Employee Name">

        <input type="number" id="attendance" placeholder="Attendance Marks">

        <input type="number" id="work" placeholder="Work Quality Marks">

        <input type="number" id="communication" placeholder="Communication Skills Marks">

        <input type="number" id="teamwork" placeholder="Teamwork Marks">

        <input type="number" id="punctuality" placeholder="Punctuality Marks">

        <button onclick="evaluateEmployee()">
            Evaluate
        </button>

        <div id="result"></div>

    </div>

    <script>

        function evaluateEmployee(){

            let name = document.getElementById("name").value;

            let attendance = parseInt(document.getElementById("attendance").value);

            let work = parseInt(document.getElementById("work").value);

            let communication = parseInt(document.getElementById("communication").value);

            let teamwork = parseInt(document.getElementById("teamwork").value);

            let punctuality = parseInt(document.getElementById("punctuality").value);

            let average = (attendance + work + communication + teamwork + punctuality) / 5;

            let performance = "";
            let promotion = "";
            let bonus = "";

            // Expert System Rules

            if(average >= 90){

                performance = "Excellent";
                promotion = "Eligible for Promotion";
                bonus = "Eligible";
            }

            else if(average >= 75){

                performance = "Very Good";
                promotion = "Eligible for Promotion";
                bonus = "Eligible";
            }

            else if(average >= 60){

                performance = "Good";
                promotion = "Not Eligible";
                bonus = "Eligible";
            }

            else if(average >= 40){

                performance = "Average";
                promotion = "Improvement Needed";
                bonus = "Not Eligible";
            }

            else{

                performance = "Poor";
                promotion = "Improvement Needed";
                bonus = "Not Eligible";
            }

            document.getElementById("result").innerHTML =

            "<h3>Employee Report</h3>" +

            "<p><b>Name:</b> " + name + "</p>" +

            "<p><b>Average Score:</b> " + average + "</p>" +

            "<p><b>Performance:</b> " + performance + "</p>" +

            "<p><b>Promotion Status:</b> " + promotion + "</p>" +

            "<p><b>Bonus:</b> " + bonus + "</p>";
        }

    </script>

</body>
</html>
